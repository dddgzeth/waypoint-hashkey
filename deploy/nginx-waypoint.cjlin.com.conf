server {
    server_name waypoint.cjlin.com;

    root /opt/Waypoint;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /app.html {
        add_header Cache-Control "no-store" always;
        try_files /app.html =404;
    }

    location ~ ^/(auth|wallet|chat|execute|trust|triggers)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Public, stateless, rate-limited planning service for agent marketplaces (OKX.AI A2MCP).
    location /asp/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(plan|chains|health)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/waypoint.cjlin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waypoint.cjlin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name waypoint.cjlin.com;
    return 301 https://$host$request_uri;
}
